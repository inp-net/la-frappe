apiVersion: apps/v1
kind: Deployment
metadata:
    name: la-frappe
    namespace: la-frappe
spec:
    strategy:
      type: Recreate
    selector:
        matchLabels:
            app: la-frappe
    template:
        metadata:
            labels:
                app: la-frappe
        spec:
            initContainers:
                - name: init-volume
                  image: registry.inpt.fr/inp-net/lafrappe:0.2.1
                  # Copier les métadonnées de l'image dans le Ceph
                  command: ["sh", "-c", "if [ -z \"$(ls -A /mnt/uploads)\" ]; then cp -r /app/data/uploads/. /mnt/uploads/; fi"]
                  volumeMounts:
                    - name: la-frappe-uploads
                      mountPath: /mnt/uploads
            containers:
                - name: la-frappe
                  image: registry.inpt.fr/inp-net/lafrappe:0.2.1
                  imagePullPolicy: Always
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '250m'
                  ports:
                      - containerPort: 3000
                  envFrom:
                      - configMapRef:
                            name: la-frappe-configmap
                      - secretRef:
                            name: la-frappe-secrets
                  volumeMounts:
                      - name: la-frappe-uploads
                        mountPath: /app/data/uploads
                      - name: frappe-tree-writable
                        mountPath: /app/data/frappe_tree
            volumes:
                - name: la-frappe-uploads
                  persistentVolumeClaim:
                      claimName: la-frappe-uploads
                - name: frappe-tree-writable
                  emptyDir: {}
