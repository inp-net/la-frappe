services:
  app:
    image: la-frappe:latest
    network_mode: host
    ports:
      - "5173:3000"
    environment:
      - BETTER_AUTH_SECRET
      - DEV_FAKE_AUTH
      - AUTHENTIK_URL
      - AUTHORIZE_URL
      - TOKEN_URL
      - USER_INFO_URL
      - LOGOUT_URL
      - REDIRECT_URL
      - AUTHENTIK_ID
      - AUTHENTIK_SECRET
    volumes:
      - ./local_storage/uploads:/app/static/uploads
      - ./local_storage/browse:/app/browse
